[Nike Training Club - KPI Tile]
search = | inputlookup nike_training_club_kpis.csv | head 1
dispatch.earliest_time = -24h
dispatch.latest_time = now
display.general.type = visualizations
display.visualizations.type = custom
display.visualizations.custom.type = nike_training_club.kpi_tile
display.visualizations.custom.nike_training_club.kpi_tile.theme = dark
display.visualizations.custom.nike_training_club.kpi_tile.valueField = value
display.visualizations.custom.nike_training_club.kpi_tile.labelField = metric

[Nike Training Club - Program Bars]
search = | inputlookup nike_training_club_programs.csv | sort 0 -score | head 10
dispatch.earliest_time = -24h
dispatch.latest_time = now
display.general.type = visualizations
display.visualizations.type = custom
display.visualizations.custom.type = nike_training_club.program_bars
display.visualizations.custom.nike_training_club.program_bars.theme = dark

