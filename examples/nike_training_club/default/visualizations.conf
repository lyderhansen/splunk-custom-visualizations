[kpi_tile]
label = NTC KPI Tile
description = Bold single-value KPI with trend delta and optional sparkline
default_height = 200
allow_user_selection = true
disabled = 0
search_fragment = | inputlookup nike_training_club_kpis.csv | head 1

[program_bars]
label = NTC Program Bars
description = Ranked horizontal bars showing program engagement scores
default_height = 400
allow_user_selection = true
disabled = 0
search_fragment = | inputlookup nike_training_club_programs.csv | sort 0 -score | head 10

[trainer_board]
label = NTC Trainer Board
description = Ranked trainer leaderboard with scores and session counts
default_height = 400
allow_user_selection = true
disabled = 0
search_fragment = | inputlookup nike_training_club_trainers.csv | sort 0 -score

[engagement_gauge]
label = NTC Engagement Gauge
description = Circular arc gauge showing weekly active rate vs target
default_height = 300
allow_user_selection = true
disabled = 0
search_fragment = | inputlookup nike_training_club_kpis.csv | where metric="Active Rate"
