<form class="splunk-formatter-section" section-label="Data configurations">
    <splunk-control-group label="City field" help="SPL field for city names">
        <splunk-text-input name="nike_training_club.city_grid.cityField" default="city"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Metric field" help="SPL field for engagement metric">
        <splunk-text-input name="nike_training_club.city_grid.metricField" default="metric"></splunk-text-input>
    </splunk-control-group>
</form>
<form class="splunk-formatter-section" section-label="Data display">
    <splunk-control-group label="Max value" help="Maximum metric value for color scale">
        <splunk-text-input name="nike_training_club.city_grid.maxValue" default="100"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Show values" help="Display numeric values in cells">
        <splunk-radio-input name="nike_training_club.city_grid.showValues" default="true">
            <option value="true">Yes</option>
            <option value="false">No</option>
        </splunk-radio-input>
    </splunk-control-group>
</form>
<form class="splunk-formatter-section" section-label="Color and style">
    <splunk-control-group label="Theme" help="Light or dark theme">
        <splunk-radio-input name="nike_training_club.city_grid.theme" default="dark">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Accent color" help="Primary accent color">
        <splunk-color-picker name="nike_training_club.city_grid.accentColor" default="#CDFF00"></splunk-color-picker>
    </splunk-control-group>
    <splunk-control-group label="Accent intensity" help="Glow effect strength (0-100)">
        <splunk-text-input name="nike_training_club.city_grid.accentIntensity" default="50"></splunk-text-input>
    </splunk-control-group>
</form>
