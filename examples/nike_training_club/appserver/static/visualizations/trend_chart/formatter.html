<form class="splunk-formatter-section" section-label="Data configurations">
    <splunk-control-group label="Time field" help="SPL field for x-axis time values">
        <splunk-text-input name="nike_training_club.trend_chart.timeField" default="_time"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Value field" help="SPL field for y-axis values">
        <splunk-text-input name="nike_training_club.trend_chart.valueField" default="value"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Target field" help="SPL field for target line value">
        <splunk-text-input name="nike_training_club.trend_chart.targetField" default="target"></splunk-text-input>
    </splunk-control-group>
</form>
<form class="splunk-formatter-section" section-label="Data display">
    <splunk-control-group label="Show target line" help="Display horizontal target line">
        <splunk-radio-input name="nike_training_club.trend_chart.showTarget" default="true">
            <option value="true">Yes</option>
            <option value="false">No</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Decimals" help="Number of decimal places">
        <splunk-text-input name="nike_training_club.trend_chart.decimals" default="0"></splunk-text-input>
    </splunk-control-group>
</form>
<form class="splunk-formatter-section" section-label="Color and style">
    <splunk-control-group label="Theme" help="Light or dark theme">
        <splunk-radio-input name="nike_training_club.trend_chart.theme" default="dark">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Accent color" help="Primary accent color">
        <splunk-color-picker name="nike_training_club.trend_chart.accentColor" default="#CDFF00"></splunk-color-picker>
    </splunk-control-group>
    <splunk-control-group label="Accent intensity" help="Glow effect strength (0-100)">
        <splunk-text-input name="nike_training_club.trend_chart.accentIntensity" default="50"></splunk-text-input>
    </splunk-control-group>
</form>
