<form class="splunk-formatter-section" section-label="Data configurations">
    <splunk-control-group label="Value field" help="SPL field containing the numeric value">
        <splunk-text-input name="nike_training_club.kpi_tile.valueField" default="value"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Label field" help="SPL field containing the metric label">
        <splunk-text-input name="nike_training_club.kpi_tile.labelField" default="metric"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Trend field" help="SPL field for trend delta percentage">
        <splunk-text-input name="nike_training_club.kpi_tile.trendField" default="delta"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Unit field" help="SPL field for value unit">
        <splunk-text-input name="nike_training_club.kpi_tile.unitField" default="unit"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Sparkline field" help="Comma-separated values for sparkline">
        <splunk-text-input name="nike_training_club.kpi_tile.sparklineField" default="sparkline"></splunk-text-input>
    </splunk-control-group>
</form>
<form class="splunk-formatter-section" section-label="Data display">
    <splunk-control-group label="Decimals" help="Number of decimal places">
        <splunk-text-input name="nike_training_club.kpi_tile.decimals" default="0"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Unit position" help="Position of unit relative to value">
        <splunk-radio-input name="nike_training_club.kpi_tile.unitPosition" default="after">
            <option value="before">Before</option>
            <option value="after">After</option>
        </splunk-radio-input>
    </splunk-control-group>
</form>
<form class="splunk-formatter-section" section-label="Color and style">
    <splunk-control-group label="Theme" help="Light or dark theme">
        <splunk-radio-input name="nike_training_club.kpi_tile.theme" default="dark">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Accent color" help="Primary accent color">
        <splunk-color-picker name="nike_training_club.kpi_tile.accentColor" default="#CDFF00"></splunk-color-picker>
    </splunk-control-group>
    <splunk-control-group label="Accent intensity" help="Glow effect strength (0-100)">
        <splunk-text-input name="nike_training_club.kpi_tile.accentIntensity" default="50"></splunk-text-input>
    </splunk-control-group>
</form>
