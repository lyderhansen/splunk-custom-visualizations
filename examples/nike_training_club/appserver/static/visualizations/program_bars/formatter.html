<form class="splunk-formatter-section" section-label="Data configurations">
    <splunk-control-group label="Name field" help="SPL field for program names">
        <splunk-text-input name="nike_training_club.program_bars.nameField" default="program"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Value field" help="SPL field for engagement scores">
        <splunk-text-input name="nike_training_club.program_bars.valueField" default="score"></splunk-text-input>
    </splunk-control-group>
</form>
<form class="splunk-formatter-section" section-label="Data display">
    <splunk-control-group label="Max value" help="Maximum bar scale value">
        <splunk-text-input name="nike_training_club.program_bars.maxValue" default="100"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Show values" help="Display numeric values">
        <splunk-radio-input name="nike_training_club.program_bars.showValues" default="true">
            <option value="true">Yes</option>
            <option value="false">No</option>
        </splunk-radio-input>
    </splunk-control-group>
</form>
<form class="splunk-formatter-section" section-label="Color and style">
    <splunk-control-group label="Theme" help="Light or dark theme">
        <splunk-radio-input name="nike_training_club.program_bars.theme" default="dark">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Accent color" help="Primary accent color">
        <splunk-color-picker name="nike_training_club.program_bars.accentColor" default="#CDFF00"></splunk-color-picker>
    </splunk-control-group>
    <splunk-control-group label="Accent intensity" help="Glow effect strength (0-100)">
        <splunk-text-input name="nike_training_club.program_bars.accentIntensity" default="50"></splunk-text-input>
    </splunk-control-group>
</form>
