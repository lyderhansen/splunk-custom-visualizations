[HBO Max Viz Pack - KPI Tile Demo]
search = | makeresults count=1 \
| eval value=96400000, delta=2300000
dispatch.earliest_time = -24h
dispatch.latest_time = now
display.general.type = visualizations
display.visualizations.type = custom
display.visualizations.custom.type = hbo_max_viz.kpi_tile
display.visualizations.custom.hbo_max_viz.kpi_tile.theme = dark
display.visualizations.custom.hbo_max_viz.kpi_tile.label = Total Subscribers
display.visualizations.custom.hbo_max_viz.kpi_tile.showGlow = true
display.visualizations.custom.hbo_max_viz.kpi_tile.showDelta = true
display.visualizations.custom.hbo_max_viz.kpi_tile.deltaField = delta

