[HBO Max Viz Pack - Content Donut Demo]
search = | makeresults count=5 \
| streamstats count as i \
| eval category=case(i==1,"Drama",i==2,"Comedy",i==3,"Documentary",i==4,"Action",i==5,"Sci-Fi"), \
count=case(i==1,340,i==2,280,i==3,190,i==4,150,i==5,120) \
| table category count
dispatch.earliest_time = -24h
dispatch.latest_time = now
display.general.type = visualizations
display.visualizations.type = custom
display.visualizations.custom.type = hbo_max_viz.content_donut
display.visualizations.custom.hbo_max_viz.content_donut.theme = dark

[HBO Max Viz Pack - Top Content Demo]
search = | makeresults count=10 \
| streamstats count as i \
| eval title=case(i==1,"The Last of Us",i==2,"House of the Dragon",i==3,"Succession",i==4,"The White Lotus",i==5,"Euphoria",i==6,"True Detective",i==7,"The Penguin",i==8,"Hacks",i==9,"Industry",i==10,"Curb Your Enthusiasm"), \
views=case(i==1,42000000,i==2,38500000,i==3,31200000,i==4,27800000,i==5,24100000,i==6,21500000,i==7,19800000,i==8,16400000,i==9,14700000,i==10,12900000) \
| table title views
dispatch.earliest_time = -24h
dispatch.latest_time = now
display.general.type = visualizations
display.visualizations.type = custom
display.visualizations.custom.type = hbo_max_viz.top_content_board
display.visualizations.custom.hbo_max_viz.top_content_board.theme = dark

[HBO Max Viz Pack - Viewing Area Demo]
search = | makeresults count=24 \
| streamstats count as i \
| eval _time=relative_time(now(), "-" . i . "h"), \
viewing_hours=round(2.4 + 0.8*sin(i/4) + 0.3*sin(i/7), 2) \
| table _time viewing_hours
dispatch.earliest_time = -24h
dispatch.latest_time = now
display.general.type = visualizations
display.visualizations.type = custom
display.visualizations.custom.type = hbo_max_viz.viewing_area
display.visualizations.custom.hbo_max_viz.viewing_area.theme = dark

[HBO Max Viz Pack - Engagement Ticker Demo]
search = | makeresults count=15 \
| streamstats count as i \
| eval _time=relative_time(now(), "-" . i . "m"), \
user=case(i%5==0,"sarah_k",i%5==1,"mike_j",i%5==2,"alex_w",i%5==3,"lisa_m",i%5==4,"tom_r"), \
action=case(i%4==0,"started watching",i%4==1,"completed",i%4==2,"added to list",i%4==3,"rated 5 stars") \
| table _time user action
dispatch.earliest_time = -24h
dispatch.latest_time = now
display.general.type = visualizations
display.visualizations.type = custom
display.visualizations.custom.type = hbo_max_viz.engagement_ticker
display.visualizations.custom.hbo_max_viz.engagement_ticker.theme = dark
