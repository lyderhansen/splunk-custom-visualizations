[kpi_tile]
label = HBO Max KPI Tile
description = Premium single value KPI with sparkline, delta arrow, and spotlight glow
default_height = 200
allow_user_selection = true
disabled = 0
search_fragment = | stats latest(value) as value latest(delta) as delta

[churn_gauge]
label = HBO Max Churn Gauge
description = Ring gauge with branded purple-to-red threshold bands
default_height = 300
allow_user_selection = true
disabled = 0
search_fragment = | stats latest(value) as value

[content_donut]
label = HBO Max Content Donut
description = Part-to-whole donut with right-side legend and center total
default_height = 300
allow_user_selection = true
disabled = 0
search_fragment = | stats count by category

[top_content_board]
label = HBO Max Top Content
description = Ranked leaderboard with position badges and view counts
default_height = 400
allow_user_selection = true
disabled = 0
search_fragment = | stats sum(views) as views by title | sort -views

[viewing_area]
label = HBO Max Viewing Trend
description = Filled area chart for viewing time trends over time
default_height = 300
allow_user_selection = true
disabled = 0
search_fragment = | timechart avg(viewing_hours) as viewing_hours

[engagement_ticker]
label = HBO Max Engagement Ticker
description = Horizontally scrolling live engagement feed with time stamps
default_height = 60
allow_user_selection = true
disabled = 0
search_fragment = | head 20 | table _time user action title
