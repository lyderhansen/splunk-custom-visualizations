<form class="splunk-formatter-section" section-label="Data configurations">
    <splunk-control-group label="Value field" help="SPL column for the numeric series (Y axis)">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.valueField" value="viewing_hours"></splunk-text-input>
    </splunk-control-group>
</form>
<form class="splunk-formatter-section" section-label="Data display">
    <splunk-control-group label="Show grid" help="Draw faint horizontal grid lines in the plot area">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.showGrid" value="true">
            <option value="true">On</option>
            <option value="false">Off</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Show dots" help="Render a marker on each data point along the line">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.showDots" value="false">
            <option value="true">On</option>
            <option value="false">Off</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Theme" help="Light or dark token preset for background and typography">
        <splunk-select name="{{VIZ_NAMESPACE}}.theme" value="dark">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
        </splunk-select>
    </splunk-control-group>
</form>
<form class="splunk-formatter-section" section-label="Color and style">
    <splunk-control-group label="Area color" help="Line and area fill accent color">
        <splunk-color-picker name="{{VIZ_NAMESPACE}}.areaColor" type="custom" value="#7B61FF">
            <splunk-color>#7B61FF</splunk-color>
            <splunk-color>#A78BFA</splunk-color>
            <splunk-color>#06B6D4</splunk-color>
            <splunk-color>#22C55E</splunk-color>
            <splunk-color>#F59E0B</splunk-color>
            <splunk-color>#EF4444</splunk-color>
            <splunk-color>#E8E8F0</splunk-color>
        </splunk-color-picker>
    </splunk-control-group>
</form>
