<form class="splunk-formatter-section" section-label="Data configurations">
    <splunk-control-group label="Name field" help="SPL column for the row title (e.g. show or film name)">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.nameField" value="title"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Value field" help="SPL column for the metric shown on the right (e.g. views)">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.valueField" value="views"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Max rows" help="Maximum number of ranked rows to render">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.maxRows" value="10"></splunk-text-input>
    </splunk-control-group>
</form>
<form class="splunk-formatter-section" section-label="Data display">
    <splunk-control-group label="Theme" help="Dark or light token set for backgrounds and chrome">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.theme" value="dark">
            <option name="dark" label="Dark"></option>
            <option name="light" label="Light"></option>
        </splunk-radio-input>
    </splunk-control-group>
</form>
<form class="splunk-formatter-section" section-label="Color and style">
    <splunk-control-group label="Value color" help="Accent for rank numbers and right-aligned metric values">
        <splunk-color-picker name="{{VIZ_NAMESPACE}}.valueColor" type="custom" value="#7B61FF">
            <splunk-color>#7B61FF</splunk-color>
            <splunk-color>#A78BFA</splunk-color>
            <splunk-color>#06B6D4</splunk-color>
            <splunk-color>#3B82F6</splunk-color>
            <splunk-color>#22C55E</splunk-color>
            <splunk-color>#F59E0B</splunk-color>
            <splunk-color>#EF4444</splunk-color>
            <splunk-color>#64748B</splunk-color>
        </splunk-color-picker>
    </splunk-control-group>
</form>
