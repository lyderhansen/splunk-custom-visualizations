[lap_time_tile]
label = GT3 Lap Time Tile
description = Big KPI tile for lap times with trend delta and sparkline
default_height = 120
allow_user_selection = true
disabled = 0
search_fragment = | stats latest(lap_time) as value latest(label) as label

[sector_bar]
label = GT3 Sector Bar
description = Three-sector horizontal comparison with PB and session best coloring
default_height = 100
allow_user_selection = true
disabled = 0
search_fragment = | stats latest(s1) as s1 latest(s2) as s2 latest(s3) as s3

[tyre_gauge]
label = GT3 Tyre Gauge
description = Four-corner radial temperature gauges on car silhouette outline
default_height = 300
allow_user_selection = true
disabled = 0
search_fragment = | stats latest(fl_temp) as fl_temp latest(fr_temp) as fr_temp

[fuel_gauge]
label = GT3 Fuel Gauge
description = Vertical fill gauge with laps-remaining estimate and pit window target
default_height = 300
allow_user_selection = true
disabled = 0
search_fragment = | stats latest(level) as level latest(laps_remaining) as laps_remaining

[position_board]
label = GT3 Position Board
description = Timing tower leaderboard with gap times and position deltas
default_height = 400
allow_user_selection = true
disabled = 0
search_fragment = | table position name gap change car_number

[stint_timeline]
label = GT3 Stint Timeline
description = Horizontal race progress bar showing tyre compound strategy
default_height = 80
allow_user_selection = true
disabled = 0
search_fragment = | table start_lap end_lap compound driver

[telemetry_ticker]
label = GT3 Telemetry Ticker
description = Scrolling real-time event feed for pit calls and race incidents
default_height = 300
allow_user_selection = true
disabled = 0
search_fragment = | table _time message severity category
