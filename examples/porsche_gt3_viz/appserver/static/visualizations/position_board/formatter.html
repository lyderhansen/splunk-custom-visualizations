<form class="splunk-formatter-section" section-label="Data configurations">
    <splunk-control-group label="Position field" help="SPL field for race position number">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.positionField" value="position">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Name field" help="SPL field for driver code (3-letter)">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.nameField" value="name">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Gap field" help="SPL field for gap to leader">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.gapField" value="gap">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Change field" help="SPL field for position change (+/- integer)">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.changeField" value="change">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Car number field" help="SPL field for car number">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.carNumberField" value="car_number">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Highlight field" help="SPL field to highlight row (true/false)">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.highlightField" value="highlight">
        </splunk-text-input>
    </splunk-control-group>
</form>

<form class="splunk-formatter-section" section-label="Data display">
    <splunk-control-group label="Max rows" help="Maximum number of positions to display">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.maxRows" value="20">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Show gap" help="Display gap time to leader">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.showGap" value="true">
            <option value="true">Yes</option>
            <option value="false">No</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Show change" help="Display position change arrows">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.showChange" value="true">
            <option value="true">Yes</option>
            <option value="false">No</option>
        </splunk-radio-input>
    </splunk-control-group>
</form>

<form class="splunk-formatter-section" section-label="Color and style">
    <splunk-control-group label="Theme" help="Dark or light color scheme">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.theme" value="dark">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
        </splunk-radio-input>
    </splunk-control-group>
</form>
