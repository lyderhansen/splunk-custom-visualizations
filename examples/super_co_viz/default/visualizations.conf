[single_value_tile]
label = Single Value Tile
description = Headline KPI tile with big number, trend delta, optional sparkline
default_height = 120
allow_user_selection = true
disabled = 0
search_fragment = | stats latest(value) as value latest(delta) as delta by label

[sparkline]
label = Sparkline
description = Embedded micro-trend line — chrome-free SVG-style line for tiles and table cells
default_height = 40
allow_user_selection = true
disabled = 0
search_fragment = | timechart count

[area_chart]
label = Area Chart
description = Multi-series time-series area chart with gradient fills and optional annotation markers
default_height = 300
allow_user_selection = true
disabled = 0
search_fragment = | timechart count by source

[column_chart]
label = Column Chart
description = Vertical bar chart for categorical comparison with optional highlight bar
default_height = 300
allow_user_selection = true
disabled = 0
search_fragment = | stats count by category

[h_bar_list]
label = Horizontal Bar List
description = Top-N horizontal bar rows with tiered color coding
default_height = 280
allow_user_selection = true
disabled = 0
search_fragment = | top limit=10 source

[heatmap]
label = Heatmap Grid
description = Categorical Y x time/bucket X density grid with sequential color scale
default_height = 300
allow_user_selection = true
disabled = 0
search_fragment = | stats count by row_label col_label

[ring_gauge]
label = Ring Gauge
description = Single-value progress ring — full 360 or half-arc with threshold legend
default_height = 200
allow_user_selection = true
disabled = 0
search_fragment = | stats latest(value) as value

[donut]
label = Donut Chart
description = Part-to-whole donut ring with center label and inline legend
default_height = 250
allow_user_selection = true
disabled = 0
search_fragment = | stats sum(amount) by region

[funnel]
label = Conversion Funnel
description = Sequential drop-off funnel with step-conversion percentages
default_height = 280
allow_user_selection = true
disabled = 0
search_fragment = | stats count by stage | sort stage_order

[status_chip]
label = Status Chip
description = Compact status pill/badge — header, severity, or service variant
default_height = 40
allow_user_selection = true
disabled = 0
search_fragment = | stats latest(status) as status latest(value) as value by label

[data_table]
label = Data Table
description = Structured row table with embedded badges, chips, sparklines, and conditional coloring
default_height = 350
allow_user_selection = true
disabled = 0
search_fragment = | table _time source severity count

[pop_grid]
label = PoP Site Grid
description = Multi-site status grid (4x4 default) with utilization micro-bars
default_height = 350
allow_user_selection = true
disabled = 0
search_fragment = | stats latest(status) as status latest(util) as util by site_code site_name


[wordmark]
label = Wordmark
description = Reusable inline brand lockup — orange chevron + splunk wordmark + optional sub-mark
default_height = 48
allow_user_selection = true
disabled = 0
search_fragment = | makeresults | eval brand="splunk"
