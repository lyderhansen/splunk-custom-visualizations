<form class="splunk-formatter-section" section-label="Data">
    <splunk-control-group label="Row Field" help="Column name for Y-axis labels (e.g. tactic, day_of_week)">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.rowField" value="row_label">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Column Field" help="Column name for X-axis labels (e.g. technique, hour)">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.colField" value="col_label">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Value Field" help="Column name for cell values (e.g. count)">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.valueField" value="count">
        </splunk-text-input>
    </splunk-control-group>
</form>

<form class="splunk-formatter-section" section-label="Style">
    <splunk-control-group label="Theme" help="Light or dark colour scheme">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.theme" value="dark">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Show Cell Values" help="Display count numbers inside each cell">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.showCellValues" value="true">
            <option value="true">Yes</option>
            <option value="false">No</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Color Mode" help="Default uses blue-cyan scale, severity uses orange-red scale">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.colorMode" value="default">
            <option value="default">Default</option>
            <option value="severity">Severity</option>
        </splunk-radio-input>
    </splunk-control-group>
</form>
