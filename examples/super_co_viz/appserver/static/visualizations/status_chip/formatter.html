<form class="splunk-formatter-section" section-label="Data">
    <splunk-control-group label="Label Field" help="Column name for the chip label text">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.labelField" value="label">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Value Field" help="Column name for the chip value text">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.valueField" value="value">
        </splunk-text-input>
    </splunk-control-group>
</form>

<form class="splunk-formatter-section" section-label="Style">
    <splunk-control-group label="Theme" help="Light or dark colour scheme">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.theme" value="dark">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
        </splunk-radio-input>
    </splunk-control-group>

    <splunk-control-group label="Variant" help="Chip display style">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.variant" value="header">
            <option value="header">Header</option>
            <option value="badge">Badge</option>
            <option value="service">Service</option>
        </splunk-radio-input>
    </splunk-control-group>

    <splunk-control-group label="Accent Colour" help="Dot and accent colour (header/service variants)">
        <splunk-color-picker name="{{VIZ_NAMESPACE}}.color" type="custom" value="#2bbfb8">
            <splunk-color>#2bbfb8</splunk-color>
            <splunk-color>#118832</splunk-color>
            <splunk-color>#cba700</splunk-color>
            <splunk-color>#ff6600</splunk-color>
            <splunk-color>#d41f1f</splunk-color>
            <splunk-color>#7eb1ff</splunk-color>
            <splunk-color>#a78bfa</splunk-color>
            <splunk-color>#f73873</splunk-color>
        </splunk-color-picker>
    </splunk-control-group>
</form>
