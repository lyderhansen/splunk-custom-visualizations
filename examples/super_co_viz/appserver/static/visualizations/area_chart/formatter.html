<form class="splunk-formatter-section" section-label="Display">
    <splunk-control-group label="Theme" help="Color theme for the chart">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.theme" value="dark">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Grid Lines" help="Number of horizontal gridlines">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.gridLines" value="4">
        </splunk-text-input>
    </splunk-control-group>
</form>
<form class="splunk-formatter-section" section-label="Marker">
    <splunk-control-group label="Show Marker" help="Display an annotation marker on the chart">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.showMarker" value="false">
            <option value="true">Yes</option>
            <option value="false">No</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Marker Index" help="Data index to annotate (-1 = none)">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.markerIndex" value="-1">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Marker Label" help="Text label for the marker callout">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.markerLabel" value="">
        </splunk-text-input>
    </splunk-control-group>
</form>
