<form class="splunk-formatter-section" section-label="Wordmark">

    <splunk-control-group label="Theme" help="Color theme for the wordmark text">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.theme" value="dark">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
        </splunk-radio-input>
    </splunk-control-group>

    <splunk-control-group label="Sub-Mark" help="Optional text after the separator (e.g. Enterprise Security)">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.subMark" value="">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Align" help="Horizontal alignment of the wordmark">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.align" value="left">
            <option value="left">Left</option>
            <option value="center">Center</option>
        </splunk-radio-input>
    </splunk-control-group>

</form>
