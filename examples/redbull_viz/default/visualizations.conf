[kpi_tile]
label = RBR Telemetry Readout
description = F1 pit wall KPI tile with left accent stripe and carbon fiber texture
default_height = 120
allow_user_selection = true
disabled = 0
search_fragment = | stats count as value

[ring_gauge]
label = RBR Tachometer
description = F1 instrument cluster with segmented arc, red zone, and shift lights
default_height = 300
allow_user_selection = true
disabled = 0
search_fragment = | stats avg(value) as value

[area_chart]
label = RBR Telemetry Chart
description = F1 timing screen trace with flat fill, crosshair hover, sector colors
default_height = 300
allow_user_selection = true
disabled = 0
search_fragment = | timechart span=1s avg(speed) as Speed

[content_donut]
label = RBR Sector Breakdown
description = F1 strategy ring with hard-cut segments and data readout
default_height = 300
allow_user_selection = true
disabled = 0
search_fragment = | stats count by category

[data_table]
label = RBR Timing Tower
description = F1 live timing tower with position numbers and tyre compound badges
default_height = 300
allow_user_selection = true
disabled = 0
search_fragment = | table Driver Lap Sector1 Sector2 Sector3 Compound
