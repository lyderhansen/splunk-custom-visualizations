<form class="splunk-formatter-section" section-label="Data configurations">
    <splunk-control-group label="Category field" help="SPL field for segment labels">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.categoryField" value="category">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Value field" help="SPL field for segment values">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.valueField" value="value">
        </splunk-text-input>
    </splunk-control-group>
</form>

<form class="splunk-formatter-section" section-label="Data display">
    <splunk-control-group label="Show readout" help="Show data readout panel on the right">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.showReadout" value="true">
            <option value="true">Yes</option>
            <option value="false">No</option>
        </splunk-radio-input>
    </splunk-control-group>
</form>

<form class="splunk-formatter-section" section-label="Color and style">
    <splunk-control-group label="Theme" help="Dark or light color scheme">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.theme" value="dark">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Colors" help="Comma-separated hex colors for segments">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.colors" value="">
        </splunk-text-input>
    </splunk-control-group>
</form>
