[Infographic Shapes - Demo]
description = Demonstrates the Infographic Shapes viz with data-driven colouring
search = index=_internal sourcetype=splunkd component=Metrics \
| stats count as value \
| eval text=tostring(value, "commas"), color=if(value>5000, "#22C55E", if(value>1000, "#F59E0B", "#EF4444"))
dispatch.earliest_time = -15m
dispatch.latest_time = now
display.general.type = visualizations
display.visualizations.type = custom
display.visualizations.custom.type = infographic_shapes.infographic_shapes
display.visualizations.custom.infographic_shapes.infographic_shapes.shape = rounded_rectangle
display.visualizations.custom.infographic_shapes.infographic_shapes.fillType = gradient
display.visualizations.custom.infographic_shapes.infographic_shapes.fillColor = #1E3A5F
display.visualizations.custom.infographic_shapes.infographic_shapes.gradientColor = #06B6D4
display.visualizations.custom.infographic_shapes.infographic_shapes.gradientDirection = vertical
display.visualizations.custom.infographic_shapes.infographic_shapes.strokeColor = #06B6D4
display.visualizations.custom.infographic_shapes.infographic_shapes.strokeWidth = 2
display.visualizations.custom.infographic_shapes.infographic_shapes.strokeDash = solid
display.visualizations.custom.infographic_shapes.infographic_shapes.cornerRadius = 12
display.visualizations.custom.infographic_shapes.infographic_shapes.rotation = 0
display.visualizations.custom.infographic_shapes.infographic_shapes.padding = 8
display.visualizations.custom.infographic_shapes.infographic_shapes.opacity = 100
display.visualizations.custom.infographic_shapes.infographic_shapes.shadowEnabled = true
display.visualizations.custom.infographic_shapes.infographic_shapes.shadowColor = #000000
display.visualizations.custom.infographic_shapes.infographic_shapes.shadowBlur = 12
display.visualizations.custom.infographic_shapes.infographic_shapes.shadowOffsetX = 4
display.visualizations.custom.infographic_shapes.infographic_shapes.shadowOffsetY = 4
display.visualizations.custom.infographic_shapes.infographic_shapes.glowEnabled = false
display.visualizations.custom.infographic_shapes.infographic_shapes.glowColor = #06B6D4
display.visualizations.custom.infographic_shapes.infographic_shapes.glowSize = 15
display.visualizations.custom.infographic_shapes.infographic_shapes.reflectionEnabled = false
display.visualizations.custom.infographic_shapes.infographic_shapes.reflectionOpacity = 0.15
display.visualizations.custom.infographic_shapes.infographic_shapes.animationType = none
display.visualizations.custom.infographic_shapes.infographic_shapes.text = Events
display.visualizations.custom.infographic_shapes.infographic_shapes.fontFamily =
display.visualizations.custom.infographic_shapes.infographic_shapes.fontSize = 0
display.visualizations.custom.infographic_shapes.infographic_shapes.fontWeight = bold
display.visualizations.custom.infographic_shapes.infographic_shapes.textColor = #FFFFFF
display.visualizations.custom.infographic_shapes.infographic_shapes.textAlign = center
display.visualizations.custom.infographic_shapes.infographic_shapes.field = value
display.visualizations.custom.infographic_shapes.infographic_shapes.colorField = color
display.visualizations.custom.infographic_shapes.infographic_shapes.textField = text
display.visualizations.custom.infographic_shapes.infographic_shapes.warningThreshold =
display.visualizations.custom.infographic_shapes.infographic_shapes.criticalThreshold =
display.visualizations.custom.infographic_shapes.infographic_shapes.normalColor = #22C55E
display.visualizations.custom.infographic_shapes.infographic_shapes.warningColor = #F59E0B
display.visualizations.custom.infographic_shapes.infographic_shapes.criticalColor = #EF4444
