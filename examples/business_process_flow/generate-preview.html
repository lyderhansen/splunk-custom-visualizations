<!DOCTYPE html>
<html>
<head><title>BPF Preview Generator</title></head>
<body style="background:#1a1a2e;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
<canvas id="c" width="440" height="240"></canvas>
<script>
var c = document.getElementById('c');
var ctx = c.getContext('2d');
var W = 440, H = 240;

// Background
ctx.fillStyle = '#0f172a';
ctx.fillRect(0, 0, W, H);

// Nodes
var nodes = [
  { x: 40,  y: 60,  w: 90, h: 55, label: 'Source',    color: '#3b82f6', shape: 'rect' },
  { x: 170, y: 30,  w: 90, h: 55, label: 'Firewall',  color: '#6366f1', shape: 'diamond' },
  { x: 170, y: 120, w: 90, h: 55, label: 'IDS',       color: '#8b5cf6', shape: 'rect' },
  { x: 310, y: 75,  w: 90, h: 55, label: 'SIEM',      color: '#0ea5e9', shape: 'hexagon' }
];

var conns = [
  { from: 0, to: 1 }, { from: 0, to: 2 },
  { from: 1, to: 3 }, { from: 2, to: 3 }
];

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function diamond(ctx, x, y, w, h) {
  var cx = x + w / 2, cy = y + h / 2;
  ctx.beginPath();
  ctx.moveTo(cx, y); ctx.lineTo(x + w, cy);
  ctx.lineTo(cx, y + h); ctx.lineTo(x, cy);
  ctx.closePath();
}

function hexagon(ctx, x, y, w, h) {
  var cx = x + w / 2, cy = y + h / 2;
  var rx = w / 2, ry = h / 2;
  ctx.beginPath();
  for (var i = 0; i < 6; i++) {
    var a = Math.PI / 3 * i - Math.PI / 6;
    var px = cx + rx * Math.cos(a), py = cy + ry * Math.sin(a);
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

// Draw connections
ctx.lineWidth = 1.5;
ctx.setLineDash([]);
for (var ci = 0; ci < conns.length; ci++) {
  var f = nodes[conns[ci].from], t = nodes[conns[ci].to];
  var fx = f.x + f.w / 2, fy = f.y + f.h / 2;
  var tx = t.x + t.w / 2, ty = t.y + t.h / 2;
  // Curved
  var mx = (fx + tx) / 2, my = (fy + ty) / 2 - 15;
  ctx.beginPath();
  ctx.moveTo(fx, fy);
  ctx.quadraticCurveTo(mx, my, tx, ty);
  ctx.strokeStyle = 'rgba(148,163,184,0.4)';
  ctx.stroke();
  // Arrow
  var angle = Math.atan2(ty - my, tx - mx);
  ctx.beginPath();
  ctx.moveTo(tx, ty);
  ctx.lineTo(tx - 8 * Math.cos(angle - 0.4), ty - 8 * Math.sin(angle - 0.4));
  ctx.lineTo(tx - 8 * Math.cos(angle + 0.4), ty - 8 * Math.sin(angle + 0.4));
  ctx.closePath();
  ctx.fillStyle = 'rgba(148,163,184,0.5)';
  ctx.fill();
}

// Draw nodes
for (var i = 0; i < nodes.length; i++) {
  var n = nodes[i];
  // Shape
  if (n.shape === 'diamond') diamond(ctx, n.x, n.y, n.w, n.h);
  else if (n.shape === 'hexagon') hexagon(ctx, n.x, n.y, n.w, n.h);
  else roundRect(ctx, n.x, n.y, n.w, n.h, 6);

  // Fill
  ctx.fillStyle = 'rgba(15,23,42,0.85)';
  ctx.fill();
  ctx.strokeStyle = n.color;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Label
  ctx.fillStyle = '#94a3b8';
  ctx.font = '9px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText(n.label, n.x + n.w / 2, n.y + 8);

  // Value
  ctx.fillStyle = '#e2e8f0';
  ctx.font = 'bold 14px -apple-system, sans-serif';
  ctx.textBaseline = 'middle';
  ctx.fillText(Math.floor(Math.random() * 9 + 1) + '.' + Math.floor(Math.random() * 9) + 'K', n.x + n.w / 2, n.y + n.h / 2 + 4);

  // Mini sparkline
  ctx.beginPath();
  var sx = n.x + 10, sy = n.y + n.h - 10, sw = n.w - 20, sh = 6;
  for (var si = 0; si < 12; si++) {
    var px = sx + (si / 11) * sw;
    var py = sy - Math.random() * sh;
    if (si === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.strokeStyle = n.color;
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.6;
  ctx.stroke();
  ctx.globalAlpha = 1;
}

// Group box (dashed)
ctx.setLineDash([4, 3]);
ctx.strokeStyle = 'rgba(99,102,241,0.3)';
ctx.lineWidth = 1;
roundRect(ctx, 158, 18, 114, 170, 8);
ctx.stroke();
ctx.setLineDash([]);

// Group label
ctx.fillStyle = 'rgba(99,102,241,0.5)';
ctx.font = '7px -apple-system, sans-serif';
ctx.textAlign = 'left';
ctx.textBaseline = 'top';
ctx.fillText('Security Zone', 163, 192);

// Title watermark
ctx.fillStyle = 'rgba(255,255,255,0.06)';
ctx.font = 'bold 11px -apple-system, sans-serif';
ctx.textAlign = 'right';
ctx.textBaseline = 'bottom';
ctx.fillText('Business Process Flow', W - 8, H - 6);

// Download link
var link = document.createElement('a');
link.download = 'preview.png';
link.href = c.toDataURL('image/png');
link.textContent = 'Download preview.png';
link.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:#3b82f6;font:14px sans-serif;';
document.body.appendChild(link);

// Also show at 2x for retina
var info = document.createElement('div');
info.textContent = '440x240 — right-click canvas or click link to save';
info.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);color:#64748b;font:12px sans-serif;';
document.body.appendChild(info);
</script>
</body>
</html>
