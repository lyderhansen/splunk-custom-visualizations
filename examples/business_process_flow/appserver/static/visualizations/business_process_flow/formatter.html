<form class="splunk-formatter-section" section-label="Fields">

    <splunk-control-group label="Label Field" help="Column name for node labels">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.labelField" value="sourcetype">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Value Field" help="Column name for node values">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.valueField" value="count">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Subtitle Field" help="Column name for subtitle text (optional)">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.subtitleField" value="">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Sparkline Field" help="Column with sparkline() data (optional, auto-detected if blank)">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.sparklineField" value="">
        </splunk-text-input>
    </splunk-control-group>

</form>

<form class="splunk-formatter-section" section-label="Appearance">

    <splunk-control-group label="Color Palette" help="Color theme for nodes">
        <splunk-select name="{{VIZ_NAMESPACE}}.palette" value="corporate">
            <option value="corporate">Corporate</option>
            <option value="security">Security</option>
            <option value="nature">Nature</option>
            <option value="neon">Neon</option>
            <option value="mono">Mono</option>
        </splunk-select>
    </splunk-control-group>

    <splunk-control-group label="Accent Line" help="Show colored accent line at top of nodes">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.accentLine" value="false">
            <option value="true">Yes</option>
            <option value="false">No</option>
        </splunk-radio-input>
    </splunk-control-group>

    <splunk-control-group label="Sparkline Type" help="Type of sparkline shown on nodes">
        <splunk-select name="{{VIZ_NAMESPACE}}.sparklineType" value="area">
            <option value="line">Line</option>
            <option value="area">Area</option>
            <option value="bar">Bar</option>
            <option value="none">None</option>
        </splunk-select>
    </splunk-control-group>

    <splunk-control-group label="Node Radius" help="Border radius in pixels">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.nodeRadius" value="8">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Default Opacity" help="Global node opacity (0-100%)">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.defaultOpacity" value="100">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Default Stroke" help="Default border pattern for nodes">
        <splunk-select name="{{VIZ_NAMESPACE}}.defaultStrokePattern" value="solid">
            <option value="solid">Solid</option>
            <option value="dashed">Dashed</option>
            <option value="dotted">Dotted</option>
            <option value="dash-dot">Dash-Dot</option>
            <option value="long-dash">Long Dash</option>
        </splunk-select>
    </splunk-control-group>

    <splunk-control-group label="Default Border Width" help="Default border width in pixels">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.defaultBorderWidth" value="1">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Default Background" help="Default node background color">
        <splunk-color-picker name="{{VIZ_NAMESPACE}}.defaultBgColor" value="">
        </splunk-color-picker>
    </splunk-control-group>

    <splunk-control-group label="Default Border Color" help="Default node border color">
        <splunk-color-picker name="{{VIZ_NAMESPACE}}.defaultBorderColor" value="">
        </splunk-color-picker>
    </splunk-control-group>

</form>

<form class="splunk-formatter-section" section-label="Editor">

    <splunk-control-group label="Lock Nodes" help="Prevent node dragging in view mode (edit via toolbar in View mode)">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.lock" value="false">
            <option value="true">Yes</option>
            <option value="false">No</option>
        </splunk-radio-input>
    </splunk-control-group>

    <splunk-control-group label="Show Edit Button" help="Show the Edit button in view mode">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.showEditButton" value="true">
            <option value="true">Yes</option>
            <option value="false">No</option>
        </splunk-radio-input>
    </splunk-control-group>

    <splunk-control-group label="Layout Data" help="Paste layout JSON here from Copy Layout, or edit manually">
        <splunk-text-area name="{{VIZ_NAMESPACE}}.editorState" value="">
        </splunk-text-area>
    </splunk-control-group>

</form>

<form class="splunk-formatter-section" section-label="Drilldown">

    <splunk-control-group label="Drilldown Field" help="Field name for drilldown events">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.drilldownField" value="sourcetype">
        </splunk-text-input>
    </splunk-control-group>

</form>

<form class="splunk-formatter-section" section-label="Effects">
    <splunk-control-group label="Raw Value" help="Show full numbers instead of abbreviated (12,450 vs 12K)">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.rawValue" value="false">
            <option value="true">Yes</option>
            <option value="false">No</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Shadow" help="Drop shadow on nodes">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.shadowEnabled" value="false">
            <option value="true">Yes</option>
            <option value="false">No</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Shadow Blur" help="Shadow blur radius in pixels">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.shadowBlur" value="8"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Shadow Offset X" help="Horizontal shadow offset">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.shadowOffsetX" value="2"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Shadow Offset Y" help="Vertical shadow offset">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.shadowOffsetY" value="2"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Shadow Color" help="Shadow color">
        <splunk-color-picker name="{{VIZ_NAMESPACE}}.shadowColor" value="#000000">
        </splunk-color-picker>
    </splunk-control-group>
    <splunk-control-group label="Glow" help="Outer glow effect on nodes">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.glowEnabled" value="false">
            <option value="true">Yes</option>
            <option value="false">No</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Glow Blur" help="Glow blur radius">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.glowBlur" value="12"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Glow Color" help="Glow color">
        <splunk-color-picker name="{{VIZ_NAMESPACE}}.glowColor" value="#3b82f6">
        </splunk-color-picker>
    </splunk-control-group>
</form>
