<form class="splunk-formatter-section" section-label="Data configurations">
    <splunk-control-group label="Value field" help="SPL column name for numeric time-series points">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.field" value="value">
        </splunk-text-input>
    </splunk-control-group>
</form>

<form class="splunk-formatter-section" section-label="Data display">
    <splunk-control-group label="Label" help="Section title shown above the sparkline card">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.label" value="">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Unit" help="Suffix appended to values (for example % or M)">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.unit" value="">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Decimals" help="Fixed decimal places (-1 = compact notation)">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.decimals" value="2">
        </splunk-text-input>
    </splunk-control-group>
</form>

<form class="splunk-formatter-section" section-label="Color and style">
    <splunk-control-group label="Theme" help="Dark Stranger Things palette or light alternate">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.theme" value="dark">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Line color" help="Sparkline stroke and headline glow color">
        <splunk-color-picker name="{{VIZ_NAMESPACE}}.lineColor" type="custom" value="#E50914">
            <splunk-color>#E50914</splunk-color>
            <splunk-color>#B81D24</splunk-color>
            <splunk-color>#831010</splunk-color>
            <splunk-color>#FF6B6B</splunk-color>
            <splunk-color>#46D369</splunk-color>
            <splunk-color>#F5A623</splunk-color>
            <splunk-color>#F5E6D3</splunk-color>
            <splunk-color>#64748B</splunk-color>
        </splunk-color-picker>
    </splunk-control-group>
    <splunk-control-group label="Show area fill" help="Fill area under the sparkline at low opacity">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.showArea" value="true">
            <option value="true">Yes</option>
            <option value="false">No</option>
        </splunk-radio-input>
    </splunk-control-group>
</form>
