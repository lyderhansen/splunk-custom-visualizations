[kpi_tile]
label = Netflix KPI Tile
description = Neon-glow single-value tile with sparkline, trend delta, and unit
default_height = 180
allow_user_selection = true
disabled = 0
search_fragment = | stats count as value latest(delta) as delta

[ring_gauge]
label = Netflix Ring Gauge
description = Cinema-style arc gauge with neon glow and threshold bands
default_height = 250
allow_user_selection = true
disabled = 0
search_fragment = | stats avg(value) as value

[content_rank]
label = Netflix Content Rank
description = Top content leaderboard with horizontal bars and rank badges
default_height = 350
allow_user_selection = true
disabled = 0
search_fragment = | top limit=10 title | rename count as views

[region_card]
label = Netflix Region Card
description = Regional breakdown horizontal bar chart with gradient fills
default_height = 300
allow_user_selection = true
disabled = 0
search_fragment = | stats sum(subscribers) as subscribers by region

[trend_spark]
label = Netflix Trend Spark
description = Mini sparkline trend card with area fill and value overlay
default_height = 200
allow_user_selection = true
disabled = 0
search_fragment = | timechart span=1d count as value

[status_chip]
label = Netflix Status Chip
description = Pill-shaped severity badge for service health indicators
default_height = 80
allow_user_selection = true
disabled = 0
search_fragment = | stats latest(status) as status latest(label) as label
