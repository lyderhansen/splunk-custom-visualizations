[battery_gauge]
label = Battery Level Gauge
description = Arc gauge showing battery state of charge with ambient glow
default_height = 400
allow_user_selection = true
disabled = 0
search_fragment = | stats latest(battery_pct) AS value

[range_kpi]
label = Range KPI Tile
description = Single value KPI with sparkline trend for remaining range
default_height = 200
allow_user_selection = true
disabled = 0
search_fragment = | stats latest(range_km) AS value

[charge_gauge]
label = Charging Power Gauge
description = Arc gauge showing charging power in kW with target marker
default_height = 300
allow_user_selection = true
disabled = 0
search_fragment = | stats latest(charge_kw) AS value

[sensor_table]
label = Sensor Temperature Table
description = Glass-panel table with status dots and drilldown
default_height = 350
allow_user_selection = true
disabled = 0
search_fragment = | table sensor temperature status

[energy_area]
label = Energy Consumption Area
description = Filled area chart showing energy consumption over time
default_height = 300
allow_user_selection = true
disabled = 0
search_fragment = | timechart avg(kwh) AS value

[regen_donut]
label = Regen/Consumption Donut
description = Donut chart showing energy split between regen and consumption
default_height = 300
allow_user_selection = true
disabled = 0
search_fragment = | stats sum(kwh) AS value BY category
