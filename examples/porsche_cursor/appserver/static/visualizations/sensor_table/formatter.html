<form class="splunk-formatter-section" section-label="Data configurations">
    <splunk-control-group label="Sensor Field" help="SPL column name for sensor name">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.sensorField" value="sensor"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Temperature Field" help="SPL column name for temperature value">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.tempField" value="temperature"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Status Field" help="SPL column name for status (normal/warning/critical)">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.statusField" value="status"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Trend Field" help="SPL column name for trend value">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.trendField" value="trend"></splunk-text-input>
    </splunk-control-group>
</form>
<form class="splunk-formatter-section" section-label="Data display">
    <splunk-control-group label="Title" help="Display title for the sensor table">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.title" value="Sensor Temperatures"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Header Font Size" help="Font size for column headers (0 = auto-scale)">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.headerFontSize" value="0"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Body Font Size" help="Font size for table body text (0 = auto-scale)">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.bodyFontSize" value="0"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Accent Intensity" help="Glow effect strength for status dots (0 to 1)">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.accentIntensity" value="0.7"></splunk-text-input>
    </splunk-control-group>
</form>
<form class="splunk-formatter-section" section-label="Color and style">
    <splunk-control-group label="Normal Color" help="Status dot color for normal readings">
        <splunk-color-picker name="{{VIZ_NAMESPACE}}.normalColor" type="custom" value="#00C9A7">
            <splunk-color>#00C9A7</splunk-color>
            <splunk-color>#22C55E</splunk-color>
            <splunk-color>#3B82F6</splunk-color>
        </splunk-color-picker>
    </splunk-control-group>
    <splunk-control-group label="Warning Color" help="Status dot color for warning readings">
        <splunk-color-picker name="{{VIZ_NAMESPACE}}.warningColor" type="custom" value="#F59E0B">
            <splunk-color>#F59E0B</splunk-color>
            <splunk-color>#FBBF24</splunk-color>
            <splunk-color>#F97316</splunk-color>
        </splunk-color-picker>
    </splunk-control-group>
    <splunk-control-group label="Critical Color" help="Status dot color for critical readings">
        <splunk-color-picker name="{{VIZ_NAMESPACE}}.criticalColor" type="custom" value="#EF4444">
            <splunk-color>#EF4444</splunk-color>
            <splunk-color>#DC2626</splunk-color>
            <splunk-color>#F87171</splunk-color>
        </splunk-color-picker>
    </splunk-control-group>
</form>
