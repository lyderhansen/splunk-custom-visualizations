<form class="splunk-formatter-section" section-label="Data configurations">
    <splunk-control-group label="Value Field" help="SPL column name for charging power value">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.field" value="value"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Label Field" help="SPL column name for label">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.labelField" value="label"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Target Field" help="SPL column name for target value">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.targetField" value="target"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Min Value" help="Minimum gauge value">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.minValue" value="0"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Max Value" help="Maximum gauge value">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.maxValue" value="350"></splunk-text-input>
    </splunk-control-group>
</form>
<form class="splunk-formatter-section" section-label="Data display">
    <splunk-control-group label="Title" help="Display title for the gauge">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.title" value="Charging Power"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Unit" help="Unit suffix displayed after value">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.unit" value="kW"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Value Font Size" help="Font size for main value (0 = auto-scale)">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.valueFontSize" value="0"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Label Font Size" help="Font size for label text (0 = auto-scale)">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.labelFontSize" value="0"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Accent Intensity" help="Glow effect strength (0 to 1)">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.accentIntensity" value="0.7"></splunk-text-input>
    </splunk-control-group>
</form>
<form class="splunk-formatter-section" section-label="Color and style">
    <splunk-control-group label="Arc Color" help="Color for the charging power arc fill">
        <splunk-color-picker name="{{VIZ_NAMESPACE}}.arcColor" type="custom" value="#3B82F6">
            <splunk-color>#3B82F6</splunk-color>
            <splunk-color>#06B6D4</splunk-color>
            <splunk-color>#00C9A7</splunk-color>
            <splunk-color>#A78BFA</splunk-color>
        </splunk-color-picker>
    </splunk-control-group>
    <splunk-control-group label="Target Color" help="Color for the target marker">
        <splunk-color-picker name="{{VIZ_NAMESPACE}}.targetColor" type="custom" value="#C8A96E">
            <splunk-color>#C8A96E</splunk-color>
            <splunk-color>#F59E0B</splunk-color>
            <splunk-color>#E8E6E3</splunk-color>
        </splunk-color-picker>
    </splunk-control-group>
</form>
