<form class="splunk-formatter-section" section-label="Data configurations">
    <splunk-control-group label="Value Field" help="SPL column name for gauge value (0-100)">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.field" value="value"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Label Field" help="SPL column name for gauge label">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.labelField" value="label"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Min Value" help="Minimum gauge value">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.minValue" value="0"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Max Value" help="Maximum gauge value">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.maxValue" value="100"></splunk-text-input>
    </splunk-control-group>
</form>
<form class="splunk-formatter-section" section-label="Data display">
    <splunk-control-group label="Title" help="Display title for the gauge">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.title" value="Battery Level"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Unit" help="Unit suffix displayed after value">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.unit" value="%"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Value Font Size" help="Font size for main value (0 = auto-scale)">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.valueFontSize" value="0"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Label Font Size" help="Font size for label text (0 = auto-scale)">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.labelFontSize" value="0"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Accent Intensity" help="Glow effect strength (0 to 1)">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.accentIntensity" value="0.7"></splunk-text-input>
    </splunk-control-group>
</form>
<form class="splunk-formatter-section" section-label="Color and style">
    <splunk-control-group label="Good Color" help="Arc color when value is above good threshold">
        <splunk-color-picker name="{{VIZ_NAMESPACE}}.goodColor" type="custom" value="#00C9A7">
            <splunk-color>#00C9A7</splunk-color>
            <splunk-color>#22C55E</splunk-color>
            <splunk-color>#3B82F6</splunk-color>
            <splunk-color>#06B6D4</splunk-color>
        </splunk-color-picker>
    </splunk-control-group>
    <splunk-control-group label="Warning Color" help="Arc color when value is between thresholds">
        <splunk-color-picker name="{{VIZ_NAMESPACE}}.warnColor" type="custom" value="#F59E0B">
            <splunk-color>#F59E0B</splunk-color>
            <splunk-color>#FBBF24</splunk-color>
            <splunk-color>#F97316</splunk-color>
        </splunk-color-picker>
    </splunk-control-group>
    <splunk-control-group label="Danger Color" help="Arc color when value is below warn threshold">
        <splunk-color-picker name="{{VIZ_NAMESPACE}}.dangerColor" type="custom" value="#EF4444">
            <splunk-color>#EF4444</splunk-color>
            <splunk-color>#DC2626</splunk-color>
            <splunk-color>#F87171</splunk-color>
        </splunk-color-picker>
    </splunk-control-group>
    <splunk-control-group label="Good Threshold" help="Values above this are good">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.goodThreshold" value="60"></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Warn Threshold" help="Values above this are warning">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.warnThreshold" value="30"></splunk-text-input>
    </splunk-control-group>
</form>
