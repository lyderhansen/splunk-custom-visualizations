[single_value_tile]
label = ACME Single-Value Tile
description = Headline KPI tile with delta arrow and optional sparkline
default_height = 140
allow_user_selection = true
disabled = 0
search_fragment = | stats latest(value) as value latest(delta) as delta

[sparkline]
label = ACME Sparkline
description = Chrome-free micro-trend line for inline use in tiles and tables
default_height = 60
allow_user_selection = true
disabled = 0
search_fragment = | timechart count

[area_chart]
label = ACME Time-Series Area Chart
description = Multi-series overlay area chart with optional annotation marker
default_height = 320
allow_user_selection = true
disabled = 0
