# Example saved searches — one per viz. Each uses makeresults so it
# renders with deterministic data even on a fresh Splunk install.

[ACME Tile - Notable Events]
search = | makeresults count=24 | streamstats count as i | eval value = round(150 + 60 * sin(i / 3.0) + random()%30, 0) | stats latest(value) as value
dispatch.earliest_time = -24h
dispatch.latest_time = now
display.general.type = visualizations
display.visualizations.type = custom
display.visualizations.custom.type = acme_splunk_viz.single_value_tile
display.visualizations.custom.acme_splunk_viz.single_value_tile.theme = dark
display.visualizations.custom.acme_splunk_viz.single_value_tile.label = Notable events (24h)
display.visualizations.custom.acme_splunk_viz.single_value_tile.unit =
display.visualizations.custom.acme_splunk_viz.single_value_tile.subLabel = vs prev 24h
display.visualizations.custom.acme_splunk_viz.single_value_tile.valueField = value
display.visualizations.custom.acme_splunk_viz.single_value_tile.deltaField = delta
display.visualizations.custom.acme_splunk_viz.single_value_tile.sparkField = spark
display.visualizations.custom.acme_splunk_viz.single_value_tile.deltaSemantics = down-good
display.visualizations.custom.acme_splunk_viz.single_value_tile.accent = #ff6600
display.visualizations.custom.acme_splunk_viz.single_value_tile.showSparkline = 1

[ACME Sparkline - Demo]
search = | makeresults count=40 | streamstats count as i | eval count = round(50 + 25 * sin(i / 4.0), 0) | timechart span=1m sum(count) as count
dispatch.earliest_time = -40m
dispatch.latest_time = now
display.general.type = visualizations
display.visualizations.type = custom
display.visualizations.custom.type = acme_splunk_viz.sparkline
display.visualizations.custom.acme_splunk_viz.sparkline.theme = dark
display.visualizations.custom.acme_splunk_viz.sparkline.field = count
display.visualizations.custom.acme_splunk_viz.sparkline.color = #2bbfb8
display.visualizations.custom.acme_splunk_viz.sparkline.fill = 1
display.visualizations.custom.acme_splunk_viz.sparkline.strokeWidth = 1.5

[ACME Area - Threat Events]
search = | makeresults count=24 | streamstats count as h | eval _time = relative_time(now(), "-" . (24-h) . "h") | eval notable=round(40+20*sin(h/3.0)+random()%10,0), blocked=round(80+30*cos(h/4.0)+random()%15,0), authfail=round(30+15*sin(h/5.0)+random()%8,0) | timechart span=1h max(notable) as notable max(blocked) as blocked max(authfail) as authfail
dispatch.earliest_time = -24h
dispatch.latest_time = now
display.general.type = visualizations
display.visualizations.type = custom
display.visualizations.custom.type = acme_splunk_viz.area_chart
display.visualizations.custom.acme_splunk_viz.area_chart.theme = dark
display.visualizations.custom.acme_splunk_viz.area_chart.colors = #ff6600,#2bbfb8,#7eb1ff
display.visualizations.custom.acme_splunk_viz.area_chart.dashedSeries =
display.visualizations.custom.acme_splunk_viz.area_chart.noFillSeries =
display.visualizations.custom.acme_splunk_viz.area_chart.gridY = 4
display.visualizations.custom.acme_splunk_viz.area_chart.markerIdx = -1
display.visualizations.custom.acme_splunk_viz.area_chart.markerSeries = 0
display.visualizations.custom.acme_splunk_viz.area_chart.markerLabel = peak
display.visualizations.custom.acme_splunk_viz.area_chart.yUnit =

