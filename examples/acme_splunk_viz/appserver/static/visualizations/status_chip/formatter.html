<form class="splunk-formatter-section" section-label="Status Chip">
    <splunk-control-group label="Theme">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.theme" value="dark">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
        </splunk-radio-input>
    </splunk-control-group>

    <splunk-control-group label="Variant">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.variant" value="header">
            <option value="header">Header</option>
            <option value="badge">Badge</option>
            <option value="service">Service</option>
        </splunk-radio-input>
    </splunk-control-group>

    <splunk-control-group label="Label">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.label" value="Notables">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Value field">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.valueField" value="value">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Pill colour">
        <splunk-color-picker name="{{VIZ_NAMESPACE}}.color" type="custom" value="#ff6600">
            <splunk-color>#ff6600</splunk-color>
            <splunk-color>#2bbfb8</splunk-color>
            <splunk-color>#7eb1ff</splunk-color>
            <splunk-color>#118832</splunk-color>
            <splunk-color>#cba700</splunk-color>
            <splunk-color>#d41f1f</splunk-color>
            <splunk-color>#a78bfa</splunk-color>
        </splunk-color-picker>
    </splunk-control-group>

    <splunk-control-group label="Label colour" help="Leave blank for theme default.">
        <splunk-color-picker name="{{VIZ_NAMESPACE}}.labelColor" type="custom" value="">
            <splunk-color>#e5eaf2</splunk-color>
            <splunk-color>rgba(229,234,242,0.66)</splunk-color>
        </splunk-color-picker>
    </splunk-control-group>

    <splunk-control-group label="Value colour">
        <splunk-color-picker name="{{VIZ_NAMESPACE}}.valueColor" type="custom" value="">
            <splunk-color>#e5eaf2</splunk-color>
            <splunk-color>#ff6600</splunk-color>
        </splunk-color-picker>
    </splunk-control-group>

    <splunk-control-group label="Value font size">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.fontSize" value="13">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Label font size">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.labelFontSize" value="12">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Dot size">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.dotSize" value="4">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Padding X">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.paddingX" value="12">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Padding Y">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.paddingY" value="7">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Border radius" help="0 = use variant default.">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.borderRadius" value="0">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Horizontal alignment">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.alignH" value="center">
            <option value="left">Left</option>
            <option value="center">Centre</option>
            <option value="right">Right</option>
        </splunk-radio-input>
    </splunk-control-group>

    <splunk-control-group label="Background colour">
        <splunk-color-picker name="{{VIZ_NAMESPACE}}.bgColor" type="custom" value="transparent">
            <splunk-color>transparent</splunk-color>
            <splunk-color>#1f2734</splunk-color>
        </splunk-color-picker>
    </splunk-control-group>
</form>
