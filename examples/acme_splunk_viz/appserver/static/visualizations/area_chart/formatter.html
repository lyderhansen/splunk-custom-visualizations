<form class="splunk-formatter-section" section-label="Area Chart">
    <splunk-control-group label="Theme">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.theme" value="dark">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
        </splunk-radio-input>
    </splunk-control-group>

    <splunk-control-group label="Series colours" help="Comma-separated hex list.">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.colors" value="#ff6600,#2bbfb8,#7eb1ff">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Dashed series indices" help="Comma-separated 0-based indices.">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.dashedSeries" value="">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="No-fill series indices">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.noFillSeries" value="">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Line width">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.lineWidth" value="1.75">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Fill opacity">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.fillOpacity" value="0.22">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Smooth lines">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.smooth" value="false">
            <option value="false">Straight</option>
            <option value="true">Smooth</option>
        </splunk-radio-input>
    </splunk-control-group>

    <splunk-control-group label="Show data points">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.showPoints" value="false">
            <option value="false">Hide</option>
            <option value="true">Show</option>
        </splunk-radio-input>
    </splunk-control-group>

    <splunk-control-group label="Point size">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.pointSize" value="3">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Y gridlines">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.gridY" value="4">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Show grid">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.showGrid" value="true">
            <option value="true">Show</option>
            <option value="false">Hide</option>
        </splunk-radio-input>
    </splunk-control-group>

    <splunk-control-group label="Show X axis">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.showXAxis" value="true">
            <option value="true">Show</option>
            <option value="false">Hide</option>
        </splunk-radio-input>
    </splunk-control-group>

    <splunk-control-group label="Show Y axis">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.showYAxis" value="true">
            <option value="true">Show</option>
            <option value="false">Hide</option>
        </splunk-radio-input>
    </splunk-control-group>

    <splunk-control-group label="X tick count">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.xTickCount" value="6">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Y unit suffix">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.yUnit" value="">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Y max override" help="0 = auto. Hard cap on Y axis.">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.yMaxOverride" value="0">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Legend position">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.legendPosition" value="off">
            <option value="off">Off</option>
            <option value="top">Top</option>
            <option value="bottom">Bottom</option>
        </splunk-radio-input>
    </splunk-control-group>

    <splunk-control-group label="Marker index" help="Annotation point. -1 disables.">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.markerIdx" value="-1">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Marker series">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.markerSeries" value="0">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Marker label">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.markerLabel" value="">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Padding top">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.padTop" value="10">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Padding right">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.padRight" value="16">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Padding bottom">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.padBottom" value="26">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Padding left">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.padLeft" value="44">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Background colour">
        <splunk-color-picker name="{{VIZ_NAMESPACE}}.bgColor" type="custom" value="transparent">
            <splunk-color>transparent</splunk-color>
            <splunk-color>#1f2734</splunk-color>
            <splunk-color>#171d27</splunk-color>
        </splunk-color-picker>
    </splunk-control-group>
</form>
