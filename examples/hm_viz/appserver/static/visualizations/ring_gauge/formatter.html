<form class="splunk-formatter-section" section-label="Data configurations">
    <splunk-control-group label="Value field" help="SPL column name for the current metric value plotted on the ring">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.field" value="value">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Label field" help="SPL column name for the gauge title or subtitle text">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.labelField" value="label">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Target field" help="SPL column name for the target reference used against value">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.targetField" value="target">
        </splunk-text-input>
    </splunk-control-group>
</form>

<form class="splunk-formatter-section" section-label="Data display">
    <splunk-control-group label="Decimals" help="Number of decimal places for center value labels">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.decimals" value="0">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Maximum value" help="Upper bound of the ring scale when not driven by results">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.maxValue" value="100">
        </splunk-text-input>
    </splunk-control-group>
</form>

<form class="splunk-formatter-section" section-label="Color and style">
    <splunk-control-group label="Theme" help="Dark or light panel chrome and typography">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.theme" value="light">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Accent color" help="Brand accent for progress arc completion and ornament">
        <splunk-color-picker name="{{VIZ_NAMESPACE}}.accentColor" type="custom" value="#0F4B7D">
            <splunk-color>#CC071E</splunk-color>
            <splunk-color>#0F4B7D</splunk-color>
            <splunk-color>#587E1F</splunk-color>
            <splunk-color>#2E7D32</splunk-color>
            <splunk-color>#ED6C02</splunk-color>
            <splunk-color>#C62828</splunk-color>
            <splunk-color>#9A9A96</splunk-color>
            <splunk-color>#1A1A1A</splunk-color>
        </splunk-color-picker>
    </splunk-control-group>
    <splunk-control-group label="Accent intensity" help="Strength of accent usage from 0 to 100 percent">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.accentIntensity" value="50">
        </splunk-text-input>
    </splunk-control-group>
</form>
