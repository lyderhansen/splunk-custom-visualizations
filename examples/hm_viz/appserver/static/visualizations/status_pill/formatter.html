<form class="splunk-formatter-section" section-label="Data configurations">
    <splunk-control-group label="Label field" help="SPL column naming each market row in the ledger">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.labelField" value="market">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Status field" help="SPL categorical column interpreted as semantic performance band">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.statusField" value="status">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Value field" help="Numeric metric displayed beside each status capsule">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.valueField" value="value">
        </splunk-text-input>
    </splunk-control-group>
</form>

<form class="splunk-formatter-section" section-label="Data display">
    <splunk-control-group label="Maximum rows" help="Highest number of table rows rendered at once">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.maxRows" value="15">
        </splunk-text-input>
    </splunk-control-group>
</form>

<form class="splunk-formatter-section" section-label="Color and style">
    <splunk-control-group label="Theme" help="Dark or light table chrome and typography">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.theme" value="light">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Growing color" help="Tint for statuses classified as expanding or outperforming baseline">
        <splunk-color-picker name="{{VIZ_NAMESPACE}}.growingColor" type="custom" value="#2E7D32">
            <splunk-color>#CC071E</splunk-color>
            <splunk-color>#0F4B7D</splunk-color>
            <splunk-color>#587E1F</splunk-color>
            <splunk-color>#2E7D32</splunk-color>
            <splunk-color>#ED6C02</splunk-color>
            <splunk-color>#C62828</splunk-color>
            <splunk-color>#9A9A96</splunk-color>
            <splunk-color>#1A1A1A</splunk-color>
        </splunk-color-picker>
    </splunk-control-group>
    <splunk-control-group label="Stable color" help="Neutral tint representing steady unchanged performance states">
        <splunk-color-picker name="{{VIZ_NAMESPACE}}.stableColor" type="custom" value="#0F4B7D">
            <splunk-color>#CC071E</splunk-color>
            <splunk-color>#0F4B7D</splunk-color>
            <splunk-color>#587E1F</splunk-color>
            <splunk-color>#2E7D32</splunk-color>
            <splunk-color>#ED6C02</splunk-color>
            <splunk-color>#C62828</splunk-color>
            <splunk-color>#9A9A96</splunk-color>
            <splunk-color>#1A1A1A</splunk-color>
        </splunk-color-picker>
    </splunk-control-group>
    <splunk-control-group label="Declining color" help="Warning tint covering declining or contraction states">
        <splunk-color-picker name="{{VIZ_NAMESPACE}}.decliningColor" type="custom" value="#C62828">
            <splunk-color>#CC071E</splunk-color>
            <splunk-color>#0F4B7D</splunk-color>
            <splunk-color>#587E1F</splunk-color>
            <splunk-color>#2E7D32</splunk-color>
            <splunk-color>#ED6C02</splunk-color>
            <splunk-color>#C62828</splunk-color>
            <splunk-color>#9A9A96</splunk-color>
            <splunk-color>#1A1A1A</splunk-color>
        </splunk-color-picker>
    </splunk-control-group>
    <splunk-control-group label="Accent intensity" help="Strength of border emphasis and halo from 0 to 100 percent">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.accentIntensity" value="50">
        </splunk-text-input>
    </splunk-control-group>
</form>
