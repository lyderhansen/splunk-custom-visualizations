<form class="splunk-formatter-section" section-label="Data configurations">
    <splunk-control-group label="Region field" help="SPL column name identifying each category label">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.regionField" value="region">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Value field" help="SPL column name for magnitude driving bar length">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.valueField" value="value">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Trend field" help="Optional SPL column for directional trend glyphs or delta">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.trendField" value="trend">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Maximum bars" help="Cap on how many ranked rows render in the panel">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.maxBars" value="10">
        </splunk-text-input>
    </splunk-control-group>
</form>

<form class="splunk-formatter-section" section-label="Data display">
    <splunk-control-group label="Show trend" help="Show trend column markers when data is present">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.showTrend" value="true">
            <option value="true">Yes</option>
            <option value="false">No</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Compact number" help="Abbreviate axis and value labels with compact grouping">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.compactNumber" value="true">
            <option value="true">Yes</option>
            <option value="false">No</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Decimals" help="-1 compact grouping; zero or greater fixes decimal places">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.decimals" value="-1">
        </splunk-text-input>
    </splunk-control-group>
</form>

<form class="splunk-formatter-section" section-label="Color and style">
    <splunk-control-group label="Theme" help="Dark or light typography and scaffold colors">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.theme" value="light">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Bar color" help="Brand fill tint for ranking bars excluding semantic overrides">
        <splunk-color-picker name="{{VIZ_NAMESPACE}}.barColor" type="custom" value="#0F4B7D">
            <splunk-color>#CC071E</splunk-color>
            <splunk-color>#0F4B7D</splunk-color>
            <splunk-color>#587E1F</splunk-color>
            <splunk-color>#2E7D32</splunk-color>
            <splunk-color>#ED6C02</splunk-color>
            <splunk-color>#C62828</splunk-color>
            <splunk-color>#9A9A96</splunk-color>
            <splunk-color>#1A1A1A</splunk-color>
        </splunk-color-picker>
    </splunk-control-group>
    <splunk-control-group label="Accent color" help="Secondary accent for rail lines and highlights">
        <splunk-color-picker name="{{VIZ_NAMESPACE}}.accentColor" type="custom" value="#0F4B7D">
            <splunk-color>#CC071E</splunk-color>
            <splunk-color>#0F4B7D</splunk-color>
            <splunk-color>#587E1F</splunk-color>
            <splunk-color>#2E7D32</splunk-color>
            <splunk-color>#ED6C02</splunk-color>
            <splunk-color>#C62828</splunk-color>
            <splunk-color>#9A9A96</splunk-color>
            <splunk-color>#1A1A1A</splunk-color>
        </splunk-color-picker>
    </splunk-control-group>
    <splunk-control-group label="Accent intensity" help="Strength of accent usage from 0 to 100 percent">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.accentIntensity" value="50">
        </splunk-text-input>
    </splunk-control-group>
</form>
