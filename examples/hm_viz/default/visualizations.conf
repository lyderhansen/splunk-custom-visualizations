[kpi_card]
label = H&M KPI Card
description = Branded single-value KPI with trend delta and sparkline
default_height = 180
allow_user_selection = true
disabled = 0
search_fragment = | stats latest(value) AS value latest(delta) AS delta BY metric

[ring_gauge]
label = H&M Ring Gauge
description = Circular progress gauge with target marker
default_height = 220
allow_user_selection = true
disabled = 0
search_fragment = | stats latest(value) AS value latest(target) AS target

[trend_area]
label = H&M Trend Area
description = Clean area chart with gradient fill for time series
default_height = 250
allow_user_selection = true
disabled = 0
search_fragment = | timechart span=1mon sum(revenue) AS value

[region_rank]
label = H&M Region Rank
description = Horizontal bar ranking of markets by value
default_height = 300
allow_user_selection = true
disabled = 0
search_fragment = | stats sum(revenue) AS value BY region | sort -value

[channel_donut]
label = H&M Channel Donut
description = Donut chart for part-to-whole composition
default_height = 250
allow_user_selection = true
disabled = 0
search_fragment = | stats sum(revenue) AS value BY channel

[status_pill]
label = H&M Status Pill
description = Colored status badges for market health
default_height = 200
allow_user_selection = true
disabled = 0
search_fragment = | stats latest(status) AS status BY market
