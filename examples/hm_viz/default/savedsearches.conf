[H&M Global Sales - Revenue KPI]
search = | inputlookup hm_kpi_summary.csv | search metric="Total Revenue" | table metric value delta unit sparkline
dispatch.earliest_time = -24h
dispatch.latest_time = now
display.general.type = visualizations
display.visualizations.type = custom
display.visualizations.custom.type = hm_viz.kpi_card
display.visualizations.custom.hm_viz.kpi_card.theme = light
display.visualizations.custom.hm_viz.kpi_card.field = value
display.visualizations.custom.hm_viz.kpi_card.labelField = metric
display.visualizations.custom.hm_viz.kpi_card.unitPosition = after
display.visualizations.custom.hm_viz.kpi_card.accentColor = #CC071E

[H&M Global Sales - Budget Attainment]
search = | inputlookup hm_kpi_summary.csv | search metric="Total Revenue" | eval fy_sales_plan_bn=27.90 | eval label="FY Sales vs Plan" | eval target=100 | eval value=round(100 * value / (fy_sales_plan_bn * 1000000000), 1) | table value label target
dispatch.earliest_time = -24h
dispatch.latest_time = now
display.general.type = visualizations
display.visualizations.type = custom
display.visualizations.custom.type = hm_viz.ring_gauge
display.visualizations.custom.hm_viz.ring_gauge.theme = light
display.visualizations.custom.hm_viz.ring_gauge.field = value
display.visualizations.custom.hm_viz.ring_gauge.labelField = label
display.visualizations.custom.hm_viz.ring_gauge.targetField = target
display.visualizations.custom.hm_viz.ring_gauge.maxValue = 100
display.visualizations.custom.hm_viz.ring_gauge.decimals = 1
display.visualizations.custom.hm_viz.ring_gauge.accentColor = #CC071E

[H&M Global Sales - Revenue Trend]
search = | inputlookup hm_revenue_trend.csv | eval _time=_time | table _time value
dispatch.earliest_time = -24h
dispatch.latest_time = now
display.general.type = visualizations
display.visualizations.type = custom
display.visualizations.custom.type = hm_viz.trend_area
display.visualizations.custom.hm_viz.trend_area.theme = light
display.visualizations.custom.hm_viz.trend_area.timeField = _time
display.visualizations.custom.hm_viz.trend_area.valueField = value
display.visualizations.custom.hm_viz.trend_area.lineColor = #0F4B7D
display.visualizations.custom.hm_viz.trend_area.accentColor = #CC071E

