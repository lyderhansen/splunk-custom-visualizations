[kpi_tile]
label = Disney+ KPI Tile
description = Branded single-value tile with accent gradient bar and delta arrow
default_height = 180
allow_user_selection = true
disabled = 0
search_fragment = | stats count as value latest(delta) as delta

[ring_gauge]
label = Disney+ Ring Gauge
description = Arc gauge with Disney+ gradient coloring and threshold bands
default_height = 250
allow_user_selection = true
disabled = 0
search_fragment = | stats avg(value) as value

[content_donut]
label = Disney+ Content Donut
description = Part-to-whole donut chart with Disney+ palette and legend
default_height = 300
allow_user_selection = true
disabled = 0
search_fragment = | stats count by category

[area_chart]
label = Disney+ Area Chart
description = Time-series area chart with Disney+ gradient fill and glow
default_height = 350
allow_user_selection = true
disabled = 0
search_fragment = | timechart span=1d count

[data_table]
label = Disney+ Data Table
description = Branded table with franchise-colored category badges
default_height = 300
allow_user_selection = true
disabled = 0
search_fragment = | table field1 field2 field3
