<form class="splunk-formatter-section" section-label="Data display">
    <splunk-control-group label="Title" help="Chart title above the plot area">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.title" value="">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Show glow" help="Glow effect on the primary series">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.showGlow" value="true">
            <option value="true">Yes</option>
            <option value="false">No</option>
        </splunk-radio-input>
    </splunk-control-group>
</form>

<form class="splunk-formatter-section" section-label="Color and style">
    <splunk-control-group label="Theme" help="Dark or light color scheme">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.theme" value="dark">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Colors" help="Comma-separated hex colors for series">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.colors" value="">
        </splunk-text-input>
    </splunk-control-group>
</form>
